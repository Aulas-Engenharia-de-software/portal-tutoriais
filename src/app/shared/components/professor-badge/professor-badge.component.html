<aside class="professor-card" aria-label="Contato do professor Lucas Martins">
  <div class="professor-identity">
    <span class="professor-avatar">LM</span>
    <span class="professor-copy">
      <small>Professor responsável</small>
      <strong>{{ nomeProfessor }}</strong>
      <span>Autor do portal</span>
    </span>
  </div>
  <div class="contact-heading"><i class="fas fa-message" aria-hidden="true"></i> Encontre o professor</div>
  <div class="contact-links">
    <a [href]="githubLink" target="_blank" rel="noopener noreferrer" aria-label="GitHub de Lucas Martins">
      <i class="fab fa-github" aria-hidden="true"></i><span>GitHub</span>
    </a>
    <a [href]="linkedinLink" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn de Lucas Martins">
      <i class="fab fa-linkedin-in" aria-hidden="true"></i><span>LinkedIn</span>
    </a>
    <a [href]="instagramLink" target="_blank" rel="noopener noreferrer" aria-label="Instagram de Lucas Martins">
      <i class="fab fa-instagram" aria-hidden="true"></i><span>Instagram</span>
    </a>
  </div>
</aside>
