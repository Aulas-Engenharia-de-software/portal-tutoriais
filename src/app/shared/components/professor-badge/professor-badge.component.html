<aside class="professor-card" aria-label="Contato do professor Lucas Martins">
  <div class="professor-identity">
    <span class="professor-copy">
      <small>Professor</small>
      <strong>{{ nomeProfessor }}</strong>
    </span>
  </div>
  <div class="contact-links">
    <a
      [href]="githubLink"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub de Lucas Martins"
      title="GitHub"
    >
      <i class="fab fa-github" aria-hidden="true"></i>
    </a>
    <a
      [href]="linkedinLink"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn de Lucas Martins"
      title="LinkedIn"
    >
      <i class="fab fa-linkedin-in" aria-hidden="true"></i>
    </a>
    <a
      [href]="instagramLink"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram de Lucas Martins"
      title="Instagram"
    >
      <i class="fab fa-instagram" aria-hidden="true"></i>
    </a>
  </div>
</aside>
