<div class="flex h-dvh bg-[var(--page-bg)] font-sans text-[var(--text)]">
  <app-sidebar
    [class.hidden]="!isMobileMenuOpen"
    (navigation)="closeMenu()"
    class="fixed inset-y-0 left-0 z-50 w-72 shrink-0 bg-[var(--surface)] md:relative md:flex md:flex-col"
  >
  </app-sidebar>

  @if (isMobileMenuOpen) {
    <button
      type="button"
      (click)="closeMenu()"
      class="fixed inset-0 bg-slate-900/50 z-40 md:hidden"
      aria-label="Fechar menu"
    ></button>
  }

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <app-header (menuToggle)="toggleMenu()" />
    <main data-page-scroll class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
