<header
  class="h-16 flex items-center justify-between px-4 sm:px-8 shrink-0 text-[var(--text-muted)]"
>
  <div class="flex items-center gap-3 min-w-0">
    <button
      type="button"
      (click)="menuToggle.emit()"
      class="md:hidden p-2 hover:bg-[var(--surface-muted)] rounded-lg"
      aria-label="Abrir menu principal"
    >
      <i class="fas fa-bars text-xl" aria-hidden="true"></i>
    </button>
    <span class="text-sm truncate">Área de estudo</span>
  </div>
  <span class="text-sm whitespace-nowrap" aria-label="Semestre atual">
    {{ currentYear }}.{{ currentSemester }}
  </span>
</header>
