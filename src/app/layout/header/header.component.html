<header class="h-16 flex items-center justify-between px-4 sm:px-8 bg-white border-b border-slate-200 shrink-0">
  <div class="flex items-center gap-3 min-w-0">
    <button type="button" (click)="menuToggle.emit()" class="md:hidden p-2 text-slate-500 hover:bg-slate-100 rounded-lg"
            aria-label="Abrir menu principal">
      <i class="fas fa-bars text-xl" aria-hidden="true"></i>
    </button>
    <div class="min-w-0">
      <span class="block text-[10px] font-bold text-orange-600 uppercase tracking-widest">Portal autoral de ensino</span>
      <h2 class="text-sm font-semibold text-slate-700 truncate">Disciplinas do Prof. Lucas Martins</h2>
    </div>
  </div>
  <span class="text-xs font-medium bg-slate-100 px-2.5 py-1.5 rounded-lg text-slate-600 whitespace-nowrap">
    {{ currentYear }}.{{ currentSemester }}
  </span>
</header>
