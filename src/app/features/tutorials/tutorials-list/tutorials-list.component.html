<div class="library-shell">
  <header class="page-heading">
    <span>{{ contextLabel }}</span>
    <h1>{{ pageTitle }}</h1>
  </header>

  <label class="search-field">
    <span class="sr-only">Buscar conteúdo</span>
    <i class="fas fa-search" aria-hidden="true"></i>
    <input [(ngModel)]="searchQuery" type="search" placeholder="Buscar conteúdo…" />
  </label>

  <section class="content-grid" aria-live="polite">
    @for (entry of filteredEntries; track entry.slug) {
      <a class="content-card" [routerLink]="['/tutoriais', entry.slug]">
        <div class="card-icon"><i [class]="entry.icon" aria-hidden="true"></i></div>
        <div class="card-body">
          <h2>{{ entry.title }}</h2>
          <div class="card-footer">
            <span
              ><i class="far fa-clock" aria-hidden="true"></i>{{ entry.readingMinutes }} min</span
            >
            <strong>Abrir <i class="fas fa-arrow-right" aria-hidden="true"></i></strong>
          </div>
        </div>
      </a>
    } @empty {
      @if (searchQuery.trim()) {
        <div class="empty-state">
          <div><i class="fas fa-folder-open" aria-hidden="true"></i></div>
          <h2>Nenhum resultado</h2>
          <button type="button" (click)="clearFilters()">Ver todos os conteúdos</button>
        </div>
      } @else {
        <app-coming-soon
          [title]="pageTitle + ' em preparação'"
          [embedded]="true"
          [actionLink]="null"
          actionLabel="Ver todos os conteúdos"
          (actionRequested)="clearFilters()"
        />
      }
    }
  </section>

  <aside class="materials-link">
    <a
      routerLink="/materiais"
      [queryParams]="{ disciplina: selectedDiscipline === 'Todas' ? null : selectedDiscipline }"
    >
      Ver materiais <i class="fas fa-arrow-right" aria-hidden="true"></i>
    </a>
  </aside>
</div>
