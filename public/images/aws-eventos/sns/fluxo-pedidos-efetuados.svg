<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de eventos de pedidos efetuados</title>
  <desc id="description">Um evento PedidoEfetuado é publicado no tópico SNS pedidos-efetuados.fifo. A assinatura entrega o JSON original à fila SQS pedidos-efetuados-processamento.fifo. A policy da fila autoriza o tópico por seu ARN. Os recursos ficam na mesma conta e região.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="360" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="42" font-size="23" font-weight="700" fill="#0f172a">Do pedido à fila de processamento</text>
    <text x="38" y="70" font-size="15" fill="#475569">Um tópico SNS e uma fila SQS · mesma conta AWS · região us-east-1</text>
    <rect x="38" y="113" width="226" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="58" y="146" font-size="13" font-weight="700" fill="#475569">1. PUBLICAR</text>
    <text x="58" y="179" font-size="21" font-weight="700" fill="#0f172a">Pedido efetuado</text>
    <text x="58" y="209" font-size="15" fill="#475569">Evento JSON no console SNS</text>
    <path d="M 276 178 H 326" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="340" y="113" width="277" height="130" rx="12" fill="#fff1f2" stroke="#be185d"/>
    <text x="360" y="146" font-size="13" font-weight="700" fill="#9d174d">2. DISTRIBUIR · AMAZON SNS FIFO</text>
    <text x="360" y="181" font-size="19" font-weight="700" fill="#831843">pedidos-efetuados.fifo</text>
    <text x="360" y="211" font-size="15" fill="#831843">Tópico criado no laboratório</text>
    <path d="M 629 178 H 700" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="664" y="153" text-anchor="middle" font-size="12" fill="#475569">Assinatura</text>
    <rect x="714" y="113" width="348" height="130" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="734" y="146" font-size="13" font-weight="700" fill="#5b21b6">3. RECEBER · AMAZON SQS FIFO</text>
    <text x="734" y="179" font-size="15" font-weight="700" fill="#4c1d95">pedidos-efetuados-processamento.fifo</text>
    <text x="734" y="211" font-size="15" fill="#4c1d95">Mensagem bruta: JSON original do pedido</text>
    <rect x="38" y="273" width="1024" height="55" rx="10" fill="#e2e8f0"/>
    <text x="58" y="296" font-size="14" font-weight="700" fill="#334155">Policy da fila: sns.amazonaws.com → sqs:SendMessage</text>
    <text x="58" y="316" font-size="14" fill="#334155">aws:SourceArn deve ser igual ao ARN do tópico pedidos-efetuados.fifo criado na sua conta.</text>
  </g>
</svg>
